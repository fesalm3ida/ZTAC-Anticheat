{% extends "base.html" %}
{% block title %}Criar conta · Anti-cheat{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex items-center gap-2 text-2xl font-bold tracking-tight">
        <span class="w-3 h-3 rounded-full bg-brand-500"></span>
        ANTI-CHEAT
      </div>
      <p class="text-slate-400 mt-1 text-sm">Registre-se para acessar o console</p>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
      <h1 class="text-lg font-semibold mb-6">Criar conta</h1>

      <div id="error" class="hidden mb-4 text-sm text-rose-300 bg-rose-950/50 border border-rose-900 rounded-lg px-4 py-2"></div>

      <form id="register-form" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-300 mb-1" for="username">Usuário</label>
          <input id="username" name="username" type="text" required autocomplete="username" minlength="3"
                 class="w-full rounded-lg bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1" for="password">Senha</label>
          <input id="password" name="password" type="password" required autocomplete="new-password" minlength="6"
                 class="w-full rounded-lg bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1" for="password2">Confirmar senha</label>
          <input id="password2" name="password2" type="password" required autocomplete="new-password"
                 class="w-full rounded-lg bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        <button type="submit"
                class="w-full rounded-lg bg-brand-600 hover:bg-brand-500 transition text-white font-semibold py-2.5 text-sm">
          Criar conta
        </button>
      </form>

      <p class="text-sm text-slate-400 mt-6 text-center">
        Já tem conta?
        <a href="/login" class="text-brand-500 hover:underline">Entrar</a>
      </p>
    </div>
  </div>
</div>

<script src="/static/auth.js"></script>
{% endblock %}
